<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buen Provecho</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #ff6b6b;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .search-box {
      margin-top: 10px;
    }

    input {
      padding: 10px;
      width: 60%;
      max-width: 400px;
      border-radius: 8px;
      border: none;
    }

    .filters {
      text-align: center;
      margin: 15px;
    }

    button {
      margin: 5px;
      padding: 8px 12px;
      border: none;
      background: #ddd;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #ff6b6b;
      color: white;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    .card h3 {
      margin: 10px 0;
    }

    .category {
      font-size: 12px;
      color: gray;
    }
  </style>
</head>

<body>

<header>
  <h1>🍽️ Buen Provecho</h1>
  <div class="search-box">
    <input type="text" id="search" placeholder="Search recipes...">
  </div>
</header>

<div class="filters">
  <button onclick="filterCategory('all')">All</button>
  <button onclick="filterCategory('dessert')">Desserts</button>
  <button onclick="filterCategory('healthy')">Healthy</button>
  <button onclick="filterCategory('quick')">Quick Meals</button>
</div>

<div class="container" id="recipes"></div>

<script>
  const recipes = [
    {
      name: "Chocolate Cake",
      category: "dessert",
      image: "https://source.unsplash.com/400x300/?cake",
    },
    {
      name: "Grilled Chicken Salad",
      category: "healthy",
      image: "https://source.unsplash.com/400x300/?salad",
    },
    {
      name: "Pasta",
      category: "quick",
      image: "https://source.unsplash.com/400x300/?pasta",
    },
    {
      name: "Smoothie Bowl",
      category: "healthy",
      image: "https://source.unsplash.com/400x300/?smoothie",
    },
    {
      name: "Cupcakes",
      category: "dessert",
      image: "https://source.unsplash.com/400x300/?cupcake",
    }
  ];

  const container = document.getElementById("recipes");

  function displayRecipes(data) {
    container.innerHTML = "";
    data.forEach(recipe => {
      container.innerHTML += `
        <div class="card">
          <img src="${recipe.image}" />
          <h3>${recipe.name}</h3>
          <p class="category">${recipe.category}</p>
        </div>
      `;
    });
  }

  function filterCategory(category) {
    if (category === "all") {
      displayRecipes(recipes);
    } else {
      const filtered = recipes.filter(r => r.category === category);
      displayRecipes(filtered);
    }
  }

  document.getElementById("search").addEventListener("input", (e) => {
    const value = e.target.value.toLowerCase();
    const filtered = recipes.filter(r =>
      r.name.toLowerCase().includes(value)
    );
    displayRecipes(filtered);
  });

  displayRecipes(recipes);
</script>

</body>
</html>
